<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="app-version" content="{{VERSION}}">
<meta name="theme-color" content="#2f6b4f">
<title>{{SHOP}} · ระบบขายหน้าร้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec;--card:#fffdf8;--ink:#2a2620;--mute:#6f685c;--line:#e4ddcf;
  --tea:#2f6b4f;--tea-ink:#fff;--tea-soft:#dfeee5;--cof:#7a4a2b;--cof-soft:#f0e2d4;
  --bad:#b3372b;--bad-soft:#f8e1de;--warn:#8a5a00;--warn-soft:#fbefcf;--shadow:0 1px 2px rgba(40,30,10,.08),0 4px 16px rgba(40,30,10,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17150f;--card:#221f18;--ink:#f1ebdd;--mute:#a79f8d;--line:#3a352a;
  --tea:#5fae88;--tea-ink:#10241a;--tea-soft:#1f3a2c;--cof:#d49a6a;--cof-soft:#3a2a1d;
  --bad:#ef7d70;--bad-soft:#402420;--warn:#e6b85a;--warn-soft:#3a3016;--shadow:none;}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.5 'Prompt',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left)) 0 max(14px,env(safe-area-inset-right))}
header.top{position:sticky;top:0;z-index:20;background:var(--tea);color:var(--tea-ink);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:52px;flex-wrap:wrap}
header.top h1{margin:0;font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-weight:400;opacity:.85;font-size:13px}
.hbtn{background:rgba(255,255,255,.16);border:0;color:inherit;border-radius:999px;padding:6px 14px;min-height:36px}
nav.tabs{display:flex;gap:4px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:15;overflow-x:auto}
nav.tabs .wrap{display:flex;gap:4px;width:100%}
nav.tabs button{flex:1;min-width:max-content;background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;color:var(--mute);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--tea);border-color:var(--tea)}
main{padding:14px 0 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)}.small{font-size:13px}.b{font-weight:600}.num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;min-height:42px}
.btn.pri{background:var(--tea);border-color:var(--tea);color:var(--tea-ink);font-weight:500}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn{color:var(--ink)}
.btn.pri{color:var(--tea-ink)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px}
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:9px 12px;margin:0 0 12px}
.ok{background:var(--tea-soft);color:var(--tea);border-radius:10px;padding:9px 12px;margin:0 0 12px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;margin:0 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--tea);color:var(--tea-ink);border-color:var(--tea)}
/* ขาย */
.sell>*{min-width:0}
.sell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;position:relative}
.tile .p{color:var(--cof);font-weight:600}
.tile.out{opacity:.5}
.tile .tag{position:absolute;top:8px;right:8px;background:var(--bad-soft);color:var(--bad);font-size:11px;border-radius:6px;padding:0 6px}
.cart{position:sticky;top:112px}
.cl{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);line-height:1}
.total{font-size:22px;font-weight:600}
.cartbar{display:none}
.cartbar-close{display:none}
@media (max-width:820px){
  .sell{grid-template-columns:minmax(0,1fr)}
  .cart{display:none;position:static}
  .cartbar-close{display:inline-block}
  .cart.open{display:block;position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 30px max(14px,env(safe-area-inset-left))}
  .cartbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tea);color:var(--tea-ink);padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));justify-content:space-between;align-items:center;border:0;width:100%;font-weight:600}
}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{min-width:0;background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-left)) calc(18px + env(safe-area-inset-bottom))}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 12px;font-size:18px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 14px;min-height:40px}
.seg button[aria-pressed=true]{background:var(--tea);color:var(--tea-ink);border-color:var(--tea)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--tea-soft);border-radius:12px;padding:12px}
.stat .v{font-size:22px;font-weight:600;color:var(--tea)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:500}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}
.bar{height:8px;border-radius:4px;background:var(--tea);min-width:2px}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 10px;background:var(--tea-soft);color:var(--tea)}
.pill.off{background:var(--warn-soft);color:var(--warn)}
.pill.void{background:var(--bad-soft);color:var(--bad)}
.stack>*+*{margin-top:12px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:380px}
.login h1{margin:0 0 4px;color:var(--tea);font-size:24px}
.banner{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--cof);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:90;max-width:90vw}
.cred{font:600 17px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px dashed var(--tea);border-radius:10px;padding:10px;word-break:break-all;user-select:all}
.receipt{font:13px/1.5 ui-monospace,Menlo,Consolas,'Prompt',monospace;white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
'use strict';
var APP_VERSION = document.querySelector('meta[name=app-version]').content;
var SHOP = document.title.split(' · ')[0];
var $app = document.getElementById('app');

/* ---------- ตัวช่วย ---------- */
function h(tag, props) {
  var el = document.createElement(tag);
  props = props || {};
  Object.keys(props).forEach(function (k) {
    var v = props[k];
    if (v == null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  });
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) c.forEach(function (x) { add(el, x); });
  else el.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
var baht = function (n) { return '฿' + Number(n || 0).toLocaleString('th-TH'); };
function uid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* ignore */ }
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}
function toast(msg) {
  var t = h('div', { class: 'toast', text: msg });
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 2600);
}
function api(method, url, body) {
  return fetch(url, {
    method: method, credentials: 'same-origin',
    headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined
  }).then(function (res) {
    return res.text().then(function (t) {
      var j = null; try { j = JSON.parse(t); } catch (e) { /* not json */ }
      if (res.ok) return j;
      var err = new Error((j && j.error) || 'เกิดข้อผิดพลาด (' + res.status + ')');
      err.status = res.status;
      if (res.status === 401 && S.me && url !== '/api/login') { S.me = null; render(); }
      throw err;
    });
  }, function () {
    var err = new Error('เชื่อมต่ออินเทอร์เน็ตไม่ได้'); err.network = true; throw err;
  });
}
function openSheet(build) {
  var scrim = h('div', { class: 'scrim' });
  var sheet = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' });
  function close() { scrim.remove(); }
  scrim.addEventListener('click', function (e) { if (e.target === scrim) close(); });
  scrim.appendChild(sheet);
  document.body.appendChild(scrim);
  build(sheet, close);
  return close;
}
function field(label, input) { return h('label', { class: 'f' }, h('span', { text: label }), input); }
function todayStr() { return S.today || new Date().toISOString().slice(0, 10); }
function fmtTime(iso) { return new Date(iso).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Bangkok' }); }
var PAY = { cash: 'เงินสด', transfer: 'โอน/พร้อมเพย์', other: 'อื่นๆ' };

/* ---------- สถานะ ---------- */
var S = { me: null, opt: null, today: null, menu: [], cart: [], cat: 'ทั้งหมด', tab: null, checkoutId: null, cartOpen: false, flash: null };

/* ---------- เริ่มต้น ---------- */
function boot() {
  api('GET', '/api/me').then(function (r) { applyMe(r); render(); }, function () { S.me = null; render(); });
}
function applyMe(r) {
  S.me = r.user; S.branch = r.branch; S.opt = r.opt; S.today = r.today; S.shop = r.shop;
  if (!S.tab) S.tab = r.user.role === 'hq' ? 'overview' : 'sell';
}
function render() {
  clear($app);
  if (!S.me) return $app.appendChild(loginView());
  $app.appendChild(S.me.role === 'hq' ? hqShell() : branchShell());
}

/* ---------- ล็อกอิน ---------- */
function loginView() {
  var email = h('input', { type: 'email', autocomplete: 'username', required: true, autocapitalize: 'none' });
  var pw = h('input', { type: 'password', autocomplete: 'current-password', required: true });
  var msg = h('div');
  var btn = h('button', { class: 'btn pri', type: 'submit', style: 'width:100%', text: 'เข้าสู่ระบบ' });
  var form = h('form', { onsubmit: function (e) {
    e.preventDefault(); btn.disabled = true; clear(msg);
    api('POST', '/api/login', { email: email.value, password: pw.value }).then(function (r) {
      S.tab = null; S.cart = []; applyMe(r); render();
    }, function (er) { btn.disabled = false; msg.appendChild(h('div', { class: 'err', text: er.message })); });
  } }, field('อีเมล', email), field('รหัสผ่าน', pw), msg, btn);
  return h('div', { class: 'login' }, h('div', { class: 'card' },
    h('h1', { text: SHOP }), h('p', { class: 'mute', style: 'margin:0 0 16px', text: 'ระบบขายหน้าร้าน — เข้าสู่ระบบด้วยอีเมลที่สำนักงานใหญ่ให้ไว้' }), form));
}

/* ---------- โครงหน้า ---------- */
function shell(title, sub, tabs, body) {
  var hdr = h('header', { class: 'top' }, h('div', { class: 'wrap' },
    h('h1', null, title, sub ? h('span', { class: 'sub', text: '  ' + sub }) : null),
    h('button', { class: 'hbtn', onclick: accountSheet, text: 'บัญชี' })));
  var nav = h('nav', { class: 'tabs', role: 'tablist' }, h('div', { class: 'wrap' }, tabs.map(function (t) {
    return h('button', { role: 'tab', 'aria-selected': String(S.tab === t[0]), onclick: function () { S.tab = t[0]; S.cartOpen = false; render(); window.scrollTo(0, 0); }, text: t[1] });
  })));
  return h('div', null, hdr, nav, h('main', null, h('div', { class: 'wrap' }, body)));
}
function accountSheet() {
  openSheet(function (sh, close) {
    var o = h('input', { type: 'password', autocomplete: 'current-password' });
    var n = h('input', { type: 'password', autocomplete: 'new-password' });
    var msg = h('div');
    sh.appendChild(h('h2', { text: 'บัญชีของฉัน' }));
    sh.appendChild(h('p', { class: 'mute', style: 'margin-top:-6px' }, S.me.name + ' · ' + S.me.email));
    sh.appendChild(field('รหัสผ่านเดิม', o)); sh.appendChild(field('รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)', n)); sh.appendChild(msg);
    sh.appendChild(h('div', { class: 'row' },
      h('button', { class: 'btn pri', text: 'เปลี่ยนรหัสผ่าน', onclick: function () {
        clear(msg);
        api('POST', '/api/password', { old: o.value, new: n.value }).then(function () { o.value = ''; n.value = ''; msg.appendChild(h('div', { class: 'ok', text: 'เปลี่ยนรหัสผ่านแล้ว' })); },
          function (er) { msg.appendChild(h('div', { class: 'err', text: er.message })); });
      } }),
      h('span', { class: 'grow' }),
      h('button', { class: 'btn bad', text: 'ออกจากระบบ', onclick: function () {
        api('POST', '/api/logout', {}).then(function () { S.me = null; S.tab = null; S.cart = []; close(); render(); }, function () { S.me = null; close(); render(); });
      } }),
      h('button', { class: 'btn', text: 'ปิด', onclick: close })));
  });
}

/* =========================================================
   สาขา (เจ้าของแฟรนไชส์)
   ========================================================= */
function branchShell() {
  var b = S.branch;
  var body = h('div');
  if (b && b.status !== 'active') body.appendChild(h('div', { class: 'warnbox', text: 'สาขานี้ถูกระงับการขายชั่วคราว ติดต่อสำนักงานใหญ่' }));
  var holder = h('div'); body.appendChild(holder);
  var tabs = [['sell', 'ขาย'], ['orders', 'ออเดอร์'], ['report', 'สรุปยอด'], ['stock', 'เมนูหมด/พร้อมขาย']];
  var el = shell(b ? b.name : SHOP, b && b.area ? b.area : '', tabs, body);
  if (S.tab === 'sell') sellView(holder);
  else if (S.tab === 'orders') ordersView(holder);
  else if (S.tab === 'report') reportView(holder, null);
  else stockView(holder);
  return el;
}

function loadMenu(cb) {
  api('GET', '/api/menu').then(function (r) { S.menu = r.menu; cb(); }, function (er) { toast(er.message); cb(); });
}

function sellView(root) {
  function draw() {
    clear(root);
    var cats = ['ทั้งหมด'];
    S.menu.forEach(function (m) { if (cats.indexOf(m.cat) < 0) cats.push(m.cat); });
    var list = S.menu.filter(function (m) { return S.cat === 'ทั้งหมด' || m.cat === S.cat; });
    var tiles = h('div', { class: 'tiles' }, list.map(function (m) {
      return h('button', { class: 'tile' + (m.sold_out ? ' out' : ''), disabled: m.sold_out, onclick: function () { pick(m); } },
        m.sold_out ? h('span', { class: 'tag', text: 'หมด' }) : null,
        h('span', { class: 'b', text: m.name }), h('span', { class: 'p num', text: baht(m.price) }));
    }));
    var left = h('div', null,
      h('div', { class: 'chips' }, cats.map(function (c) { return h('button', { class: 'chip', 'aria-pressed': String(S.cat === c), onclick: function () { S.cat = c; draw(); }, text: c }); })),
      S.menu.length ? tiles : h('p', { class: 'mute', text: 'ยังไม่มีเมนู' }));
    var count = S.cart.reduce(function (a, l) { return a + l.qty; }, 0);
    var sum = cartTotal();
    root.appendChild(h('div', { class: 'sell' }, left, cartPanel(draw)));
    root.appendChild(h('button', { class: 'cartbar', onclick: function () { S.cartOpen = true; draw(); } },
      h('span', { text: 'ตะกร้า ' + count + ' แก้ว' }), h('span', { class: 'num', text: baht(sum) + '  ›' })));
    if (S.cartOpen) root.querySelector('.cart').classList.add('open');
  }
  if (S.menu.length) draw(); else loadMenu(draw);
}
function cartTotal() { return S.cart.reduce(function (a, l) { return a + l.unit * l.qty; }, 0); }

function pick(m) {
  var st = { temp: 1, sweet: 2, tops: [], qty: 1, note: '' };
  if (!m.opts) { addLine(m, { temp: 0, sweet: 0, tops: [], qty: 1, note: '' }, ''); return; }
  openSheet(function (sh, close) {
    var o = S.opt;
    var box = h('div');
    function draw() {
      clear(box);
      var unit = m.price + o.temp[st.temp][1] + st.tops.reduce(function (a, i) { return a + o.tops[i][1]; }, 0);
      box.appendChild(h('h2', { text: m.name }));
      box.appendChild(h('p', { class: 'mute small', style: 'margin:0 0 6px', text: 'แบบ' }));
      box.appendChild(h('div', { class: 'seg', style: 'margin-bottom:12px' }, o.temp.map(function (t, i) {
        return h('button', { 'aria-pressed': String(st.temp === i), onclick: function () { st.temp = i; draw(); }, text: t[0] + (t[1] ? ' +' + t[1] : '') });
      })));
      box.appendChild(h('p', { class: 'mute small', style: 'margin:0 0 6px', text: 'ความหวาน' }));
      box.appendChild(h('div', { class: 'seg', style: 'margin-bottom:12px' }, o.sweet.map(function (t, i) {
        return h('button', { 'aria-pressed': String(st.sweet === i), onclick: function () { st.sweet = i; draw(); }, text: t });
      })));
      box.appendChild(h('p', { class: 'mute small', style: 'margin:0 0 6px', text: 'ท็อปปิ้ง' }));
      box.appendChild(h('div', { class: 'seg', style: 'margin-bottom:12px' }, o.tops.map(function (t, i) {
        return h('button', { 'aria-pressed': String(st.tops.indexOf(i) >= 0), onclick: function () {
          var k = st.tops.indexOf(i); if (k >= 0) st.tops.splice(k, 1); else st.tops.push(i); draw();
        }, text: t[0] + ' +' + t[1] });
      })));
      var note = h('input', { type: 'text', maxlength: '80', value: st.note, placeholder: 'เช่น แยกน้ำแข็ง', oninput: function (e) { st.note = e.target.value; } });
      box.appendChild(field('หมายเหตุ', note));
      box.appendChild(h('div', { class: 'row' },
        h('div', { class: 'qty' },
          h('button', { onclick: function () { st.qty = Math.max(1, st.qty - 1); draw(); }, text: '−' }),
          h('b', { class: 'num', text: st.qty }),
          h('button', { onclick: function () { st.qty = Math.min(99, st.qty + 1); draw(); }, text: '+' })),
        h('span', { class: 'grow' }),

    sh.appendChild(field('ชื่อสาขา', name)); sh.appendChild(field('ทำเล', area));
    if (b) sh.appendChild(field('สถานะ', status));
    else { sh.appendChild(field('ชื่อเจ้าของสาขา', oname)); sh.appendChild(field('อีเมลเจ้าของ (ใช้ล็อกอิน)', oemail)); sh.appendChild(field('รหัสผ่านเริ่มต้น', pw)); }
    sh.appendChild(msg);
    sh.appendChild(h('div', { class: 'row' }, h('span', { class: 'grow' }), h('button', { class: 'btn', text: 'ยกเลิก', onclick: close }),
      h('button', { class: 'btn pri', text: 'บันทึก', onclick: function () {
        clear(msg);
        var p = b ? api('PUT', '/api/branches/' + b.id, { name: name.value, area: area.value, status: status.value })
                  : api('POST', '/api/branches', { name: name.value, area: area.value, owner_name: oname.value, owner_email: oemail.value, password: pw.value });
        p.then(function (r) { close(); reloadBranches(); if (!b && r.temp_password) credSheet('สร้างสาขาแล้ว', r.email, r.temp_password); else toast('บันทึกแล้ว'); },
          function (er) { msg.appendChild(h('div', { class: 'err', text: er.message })); });
      } })));
  });
}
function branchItems(b) {
  openSheet(function (sh, close) {
    sh.appendChild(h('h2', { text: 'เมนู/ราคา — ' + b.name }));
    sh.appendChild(h('p', { class: 'mute small', style: 'margin-top:-6px', text: 'ใส่ราคาเฉพาะสาขา หรือเว้นว่างเพื่อใช้ราคากลาง' }));
    var box = h('div'); sh.appendChild(box);
    sh.appendChild(h('div', { class: 'row', style: 'margin-top:12px' }, h('span', { class: 'grow' }), h('button', { class: 'btn pri', text: 'เสร็จ', onclick: function () { close(); } })));
    api('GET', '/api/branches/' + b.id + '/items').then(function (r) {
      r.items.forEach(function (it) {
        var inp = h('input', { type: 'number', min: '0', inputmode: 'numeric', placeholder: String(it.base_price), value: it.override_price == null ? '' : it.override_price,
          onchange: function () {
            var v = inp.value === '' ? null : parseInt(inp.value, 10);
            api('PUT', '/api/branches/' + b.id + '/items/' + it.id, { price: v }).then(function () { toast('บันทึกราคา ' + it.name); }, function (er) { toast(er.message); });
          } });
        box.appendChild(h('div', { class: 'row', style: 'padding:5px 0' },
          h('span', { class: 'grow', text: it.name }), it.sold_out ? h('span', { class: 'pill off', text: 'หมด' }) : null, h('div', { style: 'width:96px' }, inp)));
      });
    }, function (er) { box.appendChild(h('div', { class: 'err', text: er.message })); });
  });
}

function menuAdmin(root) {
  var box = h('div', { class: 'stack' });
  root.appendChild(h('div', { class: 'row', style: 'margin-bottom:12px' }, h('h2', { class: 'grow', style: 'margin:0;font-size:18px', text: 'เมนูกลาง (ใช้กับทุกสาขา)' }),
    h('button', { class: 'btn pri', text: '+ เพิ่มเมนู', onclick: function () { menuForm(null); } })));
  root.appendChild(h('p', { class: 'mute small', style: 'margin-top:-4px', text: 'แก้ที่นี่ครั้งเดียว ทุกสาขาเห็นเมนูและราคาใหม่ทันทีที่เปิดแอปหรือขายออเดอร์ถัดไป' }));
  root.appendChild(box);
  api('GET', '/api/menu').then(function (r) {
    var cats = [];
    r.menu.forEach(function (m) { if (cats.indexOf(m.cat) < 0) cats.push(m.cat); });
    cats.forEach(function (c) {
      box.appendChild(h('div', { class: 'card' }, h('h3', { style: 'margin:0 0 6px', text: c }),
        r.menu.filter(function (m) { return m.cat === c; }).map(function (m) {
          return h('div', { class: 'row', style: 'padding:6px 0' }, h('span', { class: 'grow', text: m.name + (m.opts ? '' : ' (ไม่มีตัวเลือก)') }), h('b', { class: 'num', text: baht(m.price) }),
            h('button', { class: 'btn sm', text: 'แก้ไข', onclick: function () { menuForm(m); } }));
        })));
    });
  }, function (er) { box.appendChild(h('div', { class: 'err', text: er.message })); });
}
function menuForm(m) {
  openSheet(function (sh, close) {
    var name = h('input', { type: 'text', maxlength: '60', value: m ? m.name : '' });
    var cat = h('input', { type: 'text', maxlength: '30', value: m ? m.cat : '', placeholder: 'เช่น ชา, กาแฟ, ขนม' });
    var price = h('input', { type: 'number', min: '0', inputmode: 'numeric', value: m ? m.price : '' });
    var opts = h('select', null, h('option', { value: '1', text: 'เครื่องดื่ม (เลือกแบบ/หวาน/ท็อปปิ้ง)', selected: !m || m.opts }), h('option', { value: '0', text: 'ไม่มีตัวเลือก (ขนม ฯลฯ)', selected: m && !m.opts }));
    var msg = h('div');
    sh.appendChild(h('h2', { text: m ? 'แก้ไขเมนู' : 'เพิ่มเมนู' }));
    sh.appendChild(field('ชื่อเมนู', name)); sh.appendChild(field('หมวด', cat)); sh.appendChild(field('ราคากลาง (บาท)', price)); sh.appendChild(field('ประเภท', opts)); sh.appendChild(msg);
    var row = h('div', { class: 'row' });
    if (m) row.appendChild(h('button', { class: 'btn bad', text: 'ลบเมนู', onclick: function () {
      if (!window.__confirmDel) { window.__confirmDel = true; toast('กดอีกครั้งเพื่อยืนยันการลบ'); setTimeout(function () { window.__confirmDel = false; }, 4000); return; }
      window.__confirmDel = false;
      api('DELETE', '/api/menu/' + m.id).then(function () { close(); render(); }, function (er) { msg.appendChild(h('div', { class: 'err', text: er.message })); });
    } }));
    row.appendChild(h('span', { class: 'grow' }));
    row.appendChild(h('button', { class: 'btn', text: 'ยกเลิก', onclick: close }));
    row.appendChild(h('button', { class: 'btn pri', text: 'บันทึก', onclick: function () {
      clear(msg);
      var body = { name: name.value, cat: cat.value, price: parseInt(price.value, 10), opts: opts.value === '1' };
      (m ? api('PUT', '/api/menu/' + m.id, body) : api('POST', '/api/menu', body)).then(function () { close(); render(); toast('บันทึกแล้ว'); },
        function (er) { msg.appendChild(h('div', { class: 'err', text: er.message })); });
    } }));
    sh.appendChild(row);
  });
}

/* ---------- อัปเดตอัตโนมัติ ---------- */
function checkVersion() {
  fetch('/api/version', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !j.version || j.version === APP_VERSION) return;
    if (!S.cart.length) { location.reload(); return; }
    if (document.getElementById('upd')) return;
    var b = h('div', { class: 'banner', id: 'upd' }, h('span', { text: 'มีเวอร์ชันใหม่ — ชำระเงินออเดอร์นี้ก่อนแล้วกดอัปเดต' }),
      h('button', { class: 'btn sm', onclick: function () { location.reload(); }, text: 'อัปเดตเลย' }));
    document.body.appendChild(b);
  }).catch(function () { /* offline: ลองใหม่รอบหน้า */ });
}
setInterval(checkVersion, 60000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) checkVersion(); });

boot();
})();
</script>
</body>
</html>
